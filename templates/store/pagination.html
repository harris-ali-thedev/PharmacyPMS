{% if page %}<div class="pagination"><span>{{ page.paginator.count }} record{{ page.paginator.count|pluralize }} · Page {{ page.number }} of {{ page.paginator.num_pages }}</span><div>{% if page.has_previous %}<a class="button small" href="?page={{ page.previous_page_number }}&q={{ search|urlencode }}&kind={{ kind|urlencode }}">← Previous</a>{% endif %}{% if page.has_next %}<a class="button small" href="?page={{ page.next_page_number }}&q={{ search|urlencode }}&kind={{ kind|urlencode }}">Next →</a>{% endif %}</div></div>{% endif %}

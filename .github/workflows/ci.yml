name: Verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: medicare
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: medicare
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U medicare" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DEBUG: "true"
      DATABASE_URL: postgresql://medicare:ci-only-password@127.0.0.1:5432/medicare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check accounts config store tests manage.py
      - run: ruff format --check accounts config store tests manage.py
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --settings=config.test_settings
      - run: python manage.py collectstatic --noinput
